# ARCHIVED workflow — Phase 1 PCC pipeline.
#
# Status (2026-05-14): this validates the PCC m68k → MacBinary II build path
# that we shipped in Phase 1. The output is structurally correct but crashes
# on any Toolbox call at runtime (see ../spike-pcc/ARCHIVE.md and LEARNINGS.md
# "Phase 2 pivot"). We pivoted to Retro68 GCC → WASM for Phase 2 and are no
# longer iterating on this pipeline.
#
# Triggered manually only — auto-runs on push/PR are off so it doesn't burn
# CI minutes on every unrelated commit. Kept around so the PCC build remains
# reproducible from the source tree if anyone wants to audit it.
name: "[archived] PCC m68k pipeline (manual)"
on:
  workflow_dispatch:

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install m68k binutils
        run: sudo apt-get install -y binutils-m68k-linux-gnu

      - name: Extract Retro68 stubs
        run: bash spike-pcc/run-spike.sh setup

      - name: List extracted stubs (diagnostic)
        run: |
          echo "=== Retro68 stubs extracted ==="
          ls -lh spike-pcc/retro68-stubs/ || echo "(none)"

      - name: Build PCC (m68k target)
        run: bash spike-pcc/run-spike.sh build-pcc

      - name: Compile hello.c with PCC
        run: bash spike-pcc/run-spike.sh compile

      - name: Validate — no undefined symbols
        run: |
          UNDEF=$(m68k-linux-gnu-nm spike-pcc/build/hello.elf | grep " U " || true)
          if [ -n "$UNDEF" ]; then
            echo "FAIL: undefined symbols:"
            echo "$UNDEF"
            exit 1
          fi
          echo "PASS: zero undefined symbols"

      - name: Validate — check for 68020+ instructions (informational)
        run: |
          BAD=$(m68k-linux-gnu-objdump -d spike-pcc/build/hello.elf \
                | grep -Ei "muls\.l|mulu\.l|divs\.l|divu\.l|bfextu|bfexts|extb\.l" || true)
          if [ -n "$BAD" ]; then
            echo "NOTE: 68020+ instructions found (PCC emits these by default):"
            echo "$BAD"
          else
            echo "PASS: no 68020+ instructions (PCC may have been constrained)"
          fi

      - name: Upload ELF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-elf
          path: spike-pcc/build/hello.elf
          if-no-files-found: ignore

  phase1:
    runs-on: ubuntu-latest
    needs: phase0
    steps:
      - uses: actions/checkout@v4

      - name: Install m68k binutils
        run: sudo apt-get install -y binutils-m68k-linux-gnu

      - name: Extract Retro68 stubs
        run: bash spike-pcc/run-spike.sh setup

      - name: Build PCC (m68k target)
        run: bash spike-pcc/run-spike.sh build-pcc

      - name: Compile hello.c with PCC
        run: bash spike-pcc/run-spike.sh compile

      - name: Phase 1 — Link ELF → MacBinary via Elf2Mac
        run: bash spike-pcc/run-spike.sh link

      - name: Phase 1 — Validate MacBinary format
        run: bash spike-pcc/run-spike.sh verify

      - name: Upload MacBinary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-macbinary
          path: spike-pcc/build/hello.bin
          if-no-files-found: ignore

  phase2:
    runs-on: ubuntu-latest
    needs: phase1
    steps:
      - uses: actions/checkout@v4

      - name: Install m68k binutils
        run: sudo apt-get install -y binutils-m68k-linux-gnu

      - name: Extract Retro68 stubs
        run: bash spike-pcc/run-spike.sh setup

      - name: Build PCC (m68k target)
        run: bash spike-pcc/run-spike.sh build-pcc

      - name: Phase 2 — Assemble libtoolbox-stubs.a
        run: bash spike-pcc/run-spike.sh build-stubs

      - name: Phase 2 — Compile hello_toolbox.c with PCC
        run: bash spike-pcc/run-spike.sh compile-toolbox

      - name: Phase 2 — Dump PCC relocation types + section table
        run: |
          echo "=== Section headers ==="
          m68k-linux-gnu-readelf -S spike-pcc/build/hello_toolbox.o
          echo
          echo "=== Relocation entries ==="
          m68k-linux-gnu-readelf -r spike-pcc/build/hello_toolbox.o
          echo
          echo "=== Relocation type histogram ==="
          m68k-linux-gnu-readelf -r spike-pcc/build/hello_toolbox.o \
            | awk '/R_68K/ {print $3}' | sort | uniq -c

      - name: Phase 2 — Link toolbox ELF → MacBinary via Elf2Mac
        run: bash spike-pcc/run-spike.sh link-toolbox

      - name: Phase 2 — Validate toolbox MacBinary format
        run: bash spike-pcc/run-spike.sh verify-toolbox

      - name: Bisect — Compile hello_initgraf.c
        run: bash spike-pcc/run-spike.sh compile-initgraf

      - name: Bisect — Link hello_initgraf.bin
        run: bash spike-pcc/run-spike.sh link-initgraf

      - name: Bisect — Validate hello_initgraf MacBinary
        run: bash spike-pcc/run-spike.sh verify-initgraf

      - name: H1 probe — Compile hello_initgraf_local.c
        run: bash spike-pcc/run-spike.sh compile-initgraf-local

      - name: H1 probe — Link hello_initgraf_local.bin
        run: bash spike-pcc/run-spike.sh link-initgraf-local

      - name: H1 probe — Validate MacBinary
        run: bash spike-pcc/run-spike.sh verify-initgraf-local

      - name: H2 probe — Compile hello_initgraf_zone.c
        run: bash spike-pcc/run-spike.sh compile-initgraf-zone

      - name: H2 probe — Link hello_initgraf_zone.bin
        run: bash spike-pcc/run-spike.sh link-initgraf-zone

      - name: H2 probe — Validate MacBinary
        run: bash spike-pcc/run-spike.sh verify-initgraf-zone

      - name: Upload toolbox artifact (MacBinary + intermediates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-macbinary-toolbox
          path: |
            spike-pcc/build/hello_toolbox.bin
            spike-pcc/build/hello_toolbox.o
            spike-pcc/build/hello_toolbox.s
            spike-pcc/build/hello_initgraf.bin
            spike-pcc/build/hello_initgraf.o
            spike-pcc/build/hello_initgraf.s
            spike-pcc/build/hello_initgraf_local.bin
            spike-pcc/build/hello_initgraf_local.o
            spike-pcc/build/hello_initgraf_local.s
            spike-pcc/build/hello_initgraf_zone.bin
            spike-pcc/build/hello_initgraf_zone.o
            spike-pcc/build/hello_initgraf_zone.s
            spike-pcc/build/libtoolbox-stubs.o
          if-no-files-found: ignore
